# Publica o site no Hostinger (domains/becrew.com.br/public_html) a cada push na branch main.
# Envia só os arquivos que mudaram. Arquivos que existem apenas no servidor
# (loopy/, assets/php/users.php, assets/php/data/, crew-plataforma.php acima do public_html) não são tocados.
name: Deploy no Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /domains/becrew.com.br/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            docs/**
            README.md
            assets/php/users.example.php
            loopy/**
            assets/php/users.php
            assets/php/data/**
